<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사주 한 판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECF3; --ink:#14213D; --paper:#FBFCFE; --muted:#566280; --line:#B7C3D8;
  --wood:#2A8552; --fire:#D4402E; --earth:#B98400; --metal:#7C879B; --water:#23337A;
  --btn-text:#FBFCFE;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-hanja:"Noto Serif KR","Songti SC","SimSun","Batang",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A38; --ink:#E8EDF8; --paper:#1B2550; --muted:#A1AECB; --line:#34406E;
    --wood:#5CC48A; --fire:#FF6B57; --earth:#F0BE3C; --metal:#B5BECF; --water:#7E93F0;
    --btn-text:#121A38;
  }
}
:root[data-theme="dark"]{
  --bg:#121A38; --ink:#E8EDF8; --paper:#1B2550; --muted:#A1AECB; --line:#34406E;
  --wood:#5CC48A; --fire:#FF6B57; --earth:#F0BE3C; --metal:#B5BECF; --water:#7E93F0;
  --btn-text:#121A38;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%;}
main{max-width:720px;margin:0 auto;padding:36px 20px 72px;}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.8rem,11vw,4.6rem);line-height:1.02;letter-spacing:-.02em;margin:0 0 14px;}
.lead{margin:0 0 28px;color:var(--muted);max-width:34em;}
.e0{color:var(--wood)}.e1{color:var(--fire)}.e2{color:var(--earth)}.e3{color:var(--metal)}.e4{color:var(--water)}

/* form */
.form{display:grid;gap:16px;grid-template-columns:1fr;}
@media(min-width:560px){.form{grid-template-columns:1fr 1fr;align-items:start;}.form .full{grid-column:1/-1;}}
label.fl{display:block;font-weight:700;margin-bottom:6px;}
input[type=date],input[type=time]{
  width:100%;font:inherit;font-size:1.08rem;color:var(--ink);background:var(--paper);
  border:2px solid var(--ink);border-radius:10px;padding:11px 14px;min-height:50px;
}
input:disabled{opacity:.45;}
.check{display:flex;align-items:center;gap:10px;margin-top:10px;cursor:pointer;color:var(--muted);}
.check input{width:20px;height:20px;accent-color:var(--ink);}
:focus-visible{outline:3px solid var(--fire);outline-offset:2px;}
button{font:inherit;cursor:pointer;}
.go{font-family:var(--f-display);font-size:1.25rem;background:var(--ink);color:var(--btn-text);border:2px solid var(--ink);border-radius:10px;padding:12px 28px;min-height:52px;}
.go:hover{transform:translateY(-1px);}
.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:9px 18px;min-height:46px;font-weight:700;}
.err{color:var(--fire);font-weight:700;min-height:1.6em;margin:10px 0 0;}

/* result */
#out{margin-top:36px;}
.rule{border:0;border-top:2px solid var(--ink);margin:0 0 28px;}
.title{font-family:var(--f-display);font-size:clamp(1.9rem,7vw,2.9rem);line-height:1.12;margin:0 0 8px;letter-spacing:-.01em;}
.sub{margin:0 0 30px;color:var(--muted);}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px;}
.pillar{position:relative;background:var(--paper);border:2px solid var(--ink);border-radius:6px;text-align:center;}
.pillar.empty{border-style:dashed;background:transparent;color:var(--muted);}
.pillar .cap{font-weight:700;font-size:.85rem;padding:5px 0;border-bottom:2px solid var(--ink);}
.pillar.empty .cap{border-bottom-style:dashed;}
.half{padding:12px 2px 10px;}
.half+.half{border-top:1px solid var(--line);}
.hj{font-family:var(--f-hanja);font-weight:900;font-size:clamp(2.2rem,11vw,3.9rem);line-height:1.05;}
.tag{font-size:.8rem;color:var(--muted);margin-top:4px;line-height:1.3;}
.q{font-family:var(--f-display);font-size:2.4rem;padding:30px 0;}
.seal{position:absolute;top:-13px;right:-9px;width:36px;height:36px;border-radius:50%;background:var(--fire);color:#fff;font-family:var(--f-display);display:grid;place-items:center;font-size:1.1rem;transform:rotate(8deg);box-shadow:0 0 0 2px var(--paper);}
.note{font-size:.88rem;color:var(--muted);margin:10px 0 0;}
@keyframes drop{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:none;}}
@keyframes stamp{0%{opacity:0;transform:rotate(8deg) scale(2.2);}70%{opacity:1;transform:rotate(8deg) scale(.9);}100%{opacity:1;transform:rotate(8deg) scale(1);}}
.reveal .pillar{animation:drop .5s cubic-bezier(.2,.8,.3,1) both;}
.reveal .pillar:nth-child(1){animation-delay:.05s}.reveal .pillar:nth-child(2){animation-delay:.2s}
.reveal .pillar:nth-child(3){animation-delay:.35s}.reveal .pillar:nth-child(4){animation-delay:.5s}
.reveal .seal{animation:stamp .35s ease-out .95s both;}
@media (prefers-reduced-motion: reduce){.reveal .pillar,.reveal .seal{animation:none;}.go:hover{transform:none;}}

h2{font-family:var(--f-display);font-weight:400;font-size:1.55rem;margin:44px 0 10px;line-height:1.2;}
p{margin:0 0 12px;max-width:40em;}
.bars{display:grid;gap:8px;margin:14px 0 16px;}
.bar{display:grid;grid-template-columns:4.6em 1fr 2em;align-items:center;gap:10px;}
.bar b{font-family:var(--f-hanja);font-weight:700;}
.track{height:14px;border-radius:7px;background:var(--line);overflow:hidden;}
.fill{height:100%;border-radius:7px;background:currentColor;transition:width .6s ease;}
.bar span.n{text-align:right;color:var(--muted);}
dl.rows{margin:0;display:grid;grid-template-columns:5.2em 1fr;gap:14px 14px;}
dl.rows dt{font-family:var(--f-display);font-size:1.05rem;padding-top:1px;}
dl.rows dd{margin:0;max-width:38em;}
@media(max-width:420px){dl.rows{grid-template-columns:1fr;gap:2px;}dl.rows dd{margin-bottom:12px;}}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:40px;align-items:center;}
.status{color:var(--muted);font-size:.92rem;}
.fine{margin-top:30px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;max-width:44em;}
.closing{font-family:var(--f-display);font-size:1.25rem;margin-top:40px;line-height:1.4;}
fieldset.seg{border:0;margin:0;padding:0;min-width:0;}
fieldset.seg legend{font-weight:700;padding:0;margin-bottom:6px;}
.seg .opts{display:flex;flex-wrap:wrap;gap:8px;}
.seg label{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:10px;padding:9px 14px;min-height:46px;cursor:pointer;background:var(--paper);}
.seg input{accent-color:var(--ink);width:18px;height:18px;margin:0;}
.seg label:has(input:checked){background:var(--ink);color:var(--btn-text);}
.hint{font-size:.88rem;color:var(--muted);margin:8px 0 0;}
.chart{width:100%;height:auto;display:block;margin:14px 0 6px;overflow:visible;}
.chart text{font-family:var(--f-body);fill:var(--muted);font-size:11px;}
.chart .ln{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;}
.chart .ln.fut{stroke-dasharray:1 6;}
.chart .grid{stroke:var(--line);stroke-width:1;}
.chart .band{fill:var(--ink);opacity:.07;}
.chart .now{stroke:var(--fire);stroke-width:2;stroke-dasharray:4 4;}
.chart text.nowt{fill:var(--fire);font-weight:700;}
.chart .pk{fill:var(--earth);stroke:var(--paper);stroke-width:2;}
.chart .lo{fill:var(--water);stroke:var(--paper);stroke-width:2;}
.chart .cur{fill:var(--fire);stroke:var(--paper);stroke-width:2;}
.chart .curl{stroke:var(--fire);stroke-width:1;opacity:.5;}
.slider{width:100%;accent-color:var(--fire);margin:6px 0 4px;}
.readout{background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:12px 14px;margin:8px 0 16px;max-width:40em;font-size:.98rem;line-height:1.6;}
details.dec{border-top:2px solid var(--ink);}
details.dec:last-child{border-bottom:2px solid var(--ink);}
details.dec summary{cursor:pointer;list-style:none;padding:14px 2px;display:grid;grid-template-columns:5.6em 1fr auto;gap:10px;align-items:center;}
details.dec summary::-webkit-details-marker{display:none;}
.dec .dn{font-family:var(--f-display);font-size:1.3rem;line-height:1.2;}
.dec .dk{color:var(--muted);font-size:.95rem;line-height:1.35;}
.meter{width:76px;height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:block;}
.meter i{display:block;height:100%;background:var(--ink);}
.dec .body{padding:2px 2px 22px;}
.dec .body dl.rows{margin-top:12px;}
.badge{display:inline-block;background:var(--fire);color:#fff;border-radius:999px;font-size:.74rem;padding:0 9px;margin-left:6px;font-family:var(--f-body);vertical-align:middle;}
@media(max-width:460px){details.dec summary{grid-template-columns:1fr auto;}.dec .dk:nth-child(2){grid-column:1/-1;order:3;}.meter{width:56px;}}
</style>
</head>
<body>
<main>
  <h1>사주 한 판</h1>
  <p class="lead">생년월일만 있으면 돼요. 태어난 시각은 몰라도 괜찮으니, 아는 만큼만 넣어 주세요.</p>

  <form id="f" class="form" novalidate>
    <div>
      <label class="fl" for="date">생년월일 (양력)</label>
      <input type="date" id="date" min="1900-01-01" required>
    </div>
    <div>
      <label class="fl" for="time">태어난 시각 (선택)</label>
      <input type="time" id="time">
      <label class="check"><input type="checkbox" id="unk"> 태어난 시각을 몰라요</label>
    </div>
    <fieldset class="seg full">
      <legend>성별 (대운 방향 계산용, 선택)</legend>
      <div class="opts">
        <label><input type="radio" name="g" value="m"> 남성</label>
        <label><input type="radio" name="g" value="f"> 여성</label>
        <label><input type="radio" name="g" value="n" checked> 선택 안 함</label>
      </div>
      <p class="hint">나이대별 흐름(대운)은 성별에 따라 진행 방향이 달라져요. 선택하지 않으면 순행으로 계산해요.</p>
    </fieldset>
    <div class="full"><button type="submit" class="go">사주 보기</button></div>
  </form>
  <p id="err" class="err" role="alert"></p>

  <section id="out" aria-live="polite"></section>
</main>

<script>
(function(){
'use strict';
var SH=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var SK=['갑','을','병','정','무','기','경','신','임','계'];
var BH=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var BK=['자','축','인','묘','진','사','오','미','신','유','술','해'];
var AN=['쥐','소','호랑이','토끼','용','뱀','말','양','원숭이','닭','개','돼지'];
var SEL=[0,0,1,1,2,2,3,3,4,4];
var BEL=[4,2,0,0,2,1,1,2,3,3,2,4];
var ELK=['목','화','토','금','수'];
var ELH=['木','火','土','金','水'];
var GRP=['비겁','식상','재성','관성','인성'];

/* ---------- 천문 계산 ---------- */
function sunLon(jd){
  var T=(jd-2451545.0)/36525, r=Math.PI/180;
  var L0=280.46646+36000.76983*T+0.0003032*T*T;
  var M=(357.52911+35999.05029*T-0.0001537*T*T)*r;
  var C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  var lon=L0+C-0.00569-0.00478*Math.sin((125.04-1934.136*T)*r);
  return ((lon%360)+360)%360;
}

/* ---------- 사주 계산 ---------- */
function pillars(y,m,d,h,mi){
  var hh=h==null?12:h, mm=h==null?0:mi;
  var ms=Date.UTC(y,m-1,d,hh,mm)-9*3600000;
  var lon=sunLon(ms/86400000+2440587.5);
  var sy=y; if(m<=2 && lon>=250 && lon<315) sy=y-1;
  var mIdx=Math.floor((((lon-315)%360)+360)%360/30);
  var ys=(((sy-4)%10)+10)%10, yb=(((sy-4)%12)+12)%12;
  var mS=((ys%5)*2+2+mIdx)%10, mB=(2+mIdx)%12;
  var days=Math.round((Date.UTC(y,m-1,d)-Date.UTC(1900,0,1))/86400000);
  var di=(((days+10)%60)+60)%60, ds=di%10, db=di%12;
  var hour=null;
  if(h!=null){var hb=Math.floor(((h*60+mi+30)%1440)/120); hour={s:((ds%5)*2+hb)%10,b:hb};}
  return {year:{s:ys,b:yb},month:{s:mS,b:mB},day:{s:ds,b:db},hour:hour,sy:sy,di:di,lon:lon,mIdx:mIdx};
}
function tenGod(d,t){
  var diff=(SEL[t]-SEL[d]+5)%5, same=(d%2)===(t%2);
  var T=[['비견','겁재'],['식신','상관'],['편재','정재'],['편관','정관'],['편인','정인']];
  return {name:T[diff][same?0:1],group:diff};
}

/* ---------- 풀이 문구 ---------- */
var DAYSTEM=[
 ['큰 나무','숲의 대장님','곧게 뻗는 소나무처럼 한번 정한 방향은 쭉 갑니다. 리더 소리를 자주 듣고, 부러질지언정 굽히는 건 취향이 아니에요. 다만 “내가 맞는데?”가 입버릇이 될 수 있으니 가끔은 바람에 흔들려 보세요.'],
 ['풀꽃과 덩굴','생존의 달인','바위틈에서도 피는 꽃! 유연하고 눈치 빠르고, 어디에 던져놔도 적응합니다. 겉은 순해 보여도 속은 의외로 단단해요. 속마음을 말로 꺼내면 인생이 한결 편해져요.'],
 ['한낮의 태양','걸어 다니는 조명','방에 들어서면 분위기가 한 칸 밝아지는 타입이에요. 화끈하고 솔직하고 뒤끝 없음. 문제는 배터리가 “100% 아니면 0%”라는 것. 구름 뒤에서 쉬어가는 것도 일의 일부예요.'],
 ['촛불','은근한 불꽃','조용히 타오르지만 한번 꽂히면 끝까지 가는 집념가예요. 섬세하고 정이 많아서 사람들을 오래 따뜻하게 비춰주지만, 정작 본인 심지는 자주 흔들리니 스스로도 챙기세요.'],
 ['큰 산','듬직한 맏형·맏언니','한 자리에서 묵직하게 버티는 산이에요. 믿음직하고 약속을 잘 지키고 포용력이 큽니다. 한번 마음먹으면 굴착기로도 못 옮겨요. 변화가 무서운 게 아니라 그냥 “귀찮은” 거라고 우기는 타입.'],
 ['기름진 논밭','다 키워내는 실속파','씨앗만 던져주면 뭐든 키워내는 땅이에요. 세심하고 현실 감각이 좋고 사람을 잘 품어요. 남 챙기다 정작 본인 밥을 놓치기 쉬우니 “나 먼저” 연습이 필요합니다.'],
 ['단단한 바위와 쇠','결단의 칼잡이','돌려 말하기 싫어하는 정의파예요. 의리 있고 추진력 있고 결정은 칼같이! 그만큼 말이 직선으로 날아가 상대가 베일 때가 있어요. 칼집에 넣는 센스만 장착하면 무적입니다.'],
 ['반짝이는 보석','예민한 완벽주의자','잘 다듬어진 보석처럼 감각 좋고 세련됐어요. 눈이 높아서 마음에 드는 건 적지만, 한번 들어오면 끝까지 아껴요. 스스로에게 엄격하니 하루 한 번 “이 정도면 충분히 반짝여”를 외쳐 주세요.'],
 ['넓은 강과 바다','스케일 큰 자유영혼','생각의 폭이 바다급이에요. 아이디어도 많고 적응력도 좋고, 흘러가는 대로 사는 듯하지만 속으론 다 계산 중. 물이 넘치면 홍수, 마음이 넘치면 충동구매니 둑은 하나 쌓아 두세요.'],
 ['봄비와 이슬','촉 좋은 감성 탐정','조용히 스며들어 분위기를 읽어내는 눈치 9단이에요. 감수성도 상상력도 풍부하죠. 생각이 많아지면 새벽 3시에 이불킥 레퍼토리가 돌아가니, 일단 자고 내일 생각하세요.']
];
var EL_STRONG=[
 '성장과 도전의 기운이 넘쳐요. 새 일을 벌이는 데 재능이 있으니, 마무리를 도와줄 동료 한 명만 있으면 완벽해요.',
 '열정과 표현력이 폭발해요. 분위기 메이커지만 욱하는 불씨는 조심! 숨 한 번 돌리고 말하면 인기가 두 배.',
 '안정과 신용의 기운이 강해요. 든든하지만 고집이 단단한 흙덩이가 될 수 있으니 가끔 삽질(?)로 땅을 갈아엎어 보세요.',
 '결단과 원칙의 기운이 강해요. 일 처리는 깔끔한데 “너무 칼 같다”는 소리를 들을 수 있어요. 부드러운 한마디를 얹어 주세요.',
 '지혜와 유연함의 기운이 강해요. 생각이 깊고 상상력이 풍부한 대신 걱정도 함께 흘러넘쳐요. 걱정은 메모장에 흘려보내세요.'
];
var LUCKY=[
 {c:'초록·청록',f:'나물, 샐러드, 새콤한 음식',d:'동쪽',n:'3, 8',t:'화분 하나 들이고 동네 산책 자주 하기'},

function findTerm(ms0,target,forward){
  function f(ms){var l=sunLon(ms/86400000+2440587.5);return ((l-target+540)%360)-180;}
  var lo=forward?ms0:ms0-36*864e5, hi=forward?ms0+36*864e5:ms0;
  for(var i=0;i<50;i++){var mid=(lo+hi)/2; if(f(mid)<0) lo=mid; else hi=mid;}
  return (lo+hi)/2;
}

  var pk=0,lw=0,bestSum=-1,lowSum=1e9;

  if(amb) html+='<p class="note">이 날은 절기가 바뀌는 날이라 태어난 시각에 따라 월주(또는 년주)가 달라질 수 있어요.</p>';

  html+='<h2>나는 이런 사람</h2><p>'+D[2]+'</p>';

  html+='<h2>오행 밸런스</h2>';
  html+='<div class="bars" role="img" aria-label="오행 분포: '+ELK.map(function(n,i){return n+' '+cnt[i];}).join(', ')+'">'+barsHtml+'</div>';
  html+='<p><b class="e'+strong+'">'+ELK[strong]+'('+ELH[strong]+')</b>이 가장 강해요. '+EL_STRONG[strong]+'</p>';
  html+='<p>'+lackTxt+'</p>';

  html+='<h2>에너지 스타일</h2><p><b>'+STYLE[dom][0]+'</b><br>'+STYLE[dom][1]+'</p>';

  html+='<h2>연애, 돈, 일</h2><dl class="rows">'+
    '<dt>연애</dt><dd>'+LOVE_B[P.day.b]+' '+LOVE_G[dom]+'</dd>'+
    '<dt>재물</dt><dd>'+MONEY_G[dom]+moneyExtra+'</dd>'+
    '<dt>일</dt><dd>'+WORK_G[dom]+'</dd></dl>';

  html+='<h2>올해 운세</h2><p><b>'+yearName+'</b></p><p>올해 들어온 기운은 당신에게 <b>'+yg.name+'</b>이에요. '+YEAR_G[yg.name]+'</p>';

  var life=buildLife({y:y,m:m,d:d,h:h,mi:mi,gv:gv,P:P,ds:ds,cnt:cnt,raw:raw,nowY:now.getFullYear()});
  html+=life.html;
  html+='<h2>행운 처방전</h2><p>'+(lacking.length?'사주에 부족한 ':'상대적으로 약한 ')+'<b class="e'+lucky+'">'+ELK[lucky]+'('+ELH[lucky]+')</b> 기운을 채우는 처방이에요.</p>';
  html+='<dl class="rows"><dt>색</dt><dd>'+L.c+'</dd><dt>음식</dt><dd>'+L.f+'</dd><dt>방향</dt><dd>'+L.d+'</dd><dt>숫자</dt><dd>'+L.n+'</dd><dt>한 줄 팁</dt><dd>'+L.t+'</dd></dl>';

  html+='<p class="closing">'+CLOSE[P.di%CLOSE.length]+'</p>';
  html+='<div class="actions"><button type="button" class="ghost" id="copy">결과 복사</button><button type="button" class="ghost" id="again">다시 입력</button><span class="status" id="st" role="status"></span></div>';
  html+='<p class="fine">재미로 보는 풀이예요. 양력 기준이며 절기는 천문 계산으로 구해 분 단위 오차가 있을 수 있어요. 자시는 23:30부터로 계산했고, 태어난 시각을 모르면 시주 없이 풀이해요.</p>';

  out.innerHTML=html;
  life.bind();

  var summary='사주 한 판 결과\n'+y+'년 '+m+'월 '+d+'일'+(h==null?'':' '+pad(h)+':'+pad(mi))+' 출생\n'+
    '“'+D[1]+'” ('+SK[ds]+' '+D[0]+')\n'+
    '사주: '+(P.hour?SH[P.hour.s]+BH[P.hour.b]+' ':'')+SH[P.day.s]+BH[P.day.b]+' '+SH[P.month.s]+BH[P.month.b]+' '+SH[P.year.s]+BH[P.year.b]+'\n'+
    '오행: '+ELK.map(function(n,i){return n+cnt[i];}).join(' ')+'\n올해 십성: '+yg.name;

  $('#copy').addEventListener('click',function(){
    var st=$('#st');
    function ok(){st.textContent='복사했어요.';}
    function fail(){st.textContent='복사하지 못했어요. 화면의 내용을 직접 선택해 복사해 주세요.';}
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(summary).then(ok,fail);}
      else{
        var ta=document.createElement('textarea');ta.value=summary;document.body.appendChild(ta);ta.select();
        var r=document.execCommand('copy');document.body.removeChild(ta);r?ok():fail();
      }
    }catch(x){fail();}
  });
  $('#again').addEventListener('click',function(){
    out.innerHTML='';window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});dateEl.focus();
  });

  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  out.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
}
})();
</script>
